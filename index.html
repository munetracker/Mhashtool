<!DOCTYPE html>
<html>
<head>
<title>MHash Tool</title>

<link rel="icon" href="https://raw.githubusercontent.com/munetracker/mits_json/master/logos/no_bg.png"/>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="bcrypt.min.js"></script>
<script src="sha256Validator.js"></script>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <button id="themeBtn" class="toggle" onclick="toggleDark()">🌙 Dark Mode</button>

    <h2>🔐 Hash Generator</h2>

    <input
        id="password"
        placeholder="Enter password"
        autocomplete="off">

    <select id="algo">
    <option value="bcrypt">bcrypt</option>
    <option value="argon2i">argon2i</option>
    <option value="argon2id">argon2id</option>
    <option value="sha256">sha256 (Laravel)</option>
    </select>

    <button class="generate" onclick="generateHash()">Generate Hash</button>

    <textarea id="result" rows="2" placeholder="Generated hash"></textarea>

    <button onclick="copyHash()">📋 Copy Hash</button>

    <hr>

    <h2>🔎 Hash Verifier</h2>

    <input id="verifyPassword" placeholder="Password to verify" autocomplete="off">

    <textarea id="verifyHash" rows="2" placeholder="Paste hash here"></textarea>

    <button class="verify" onclick="verifyHash()">Verify Password</button>

    <h3 id="verifyResult"></h3>

    <hr>

    <h2>🗄 SQL Update Query</h2>

    <input
        id="username"
        value="juan_dela_cruz"
        placeholder="Username"
        autocomplete="off">

    <textarea
        id="sqlResult"
        rows="2"
        readonly
        placeholder="SQL query will appear here"></textarea>

    <button onclick="copySQL()">📋 Copy SQL</button>

</div>

<script src="app.js"></script>

</body>
</html>
